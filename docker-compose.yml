services:
  kommo_mesager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kommo-mesager
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
